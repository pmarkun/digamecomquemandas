services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: diga-me-postgres
    environment:
      POSTGRES_DB: qtnf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: diga-me-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: diga-me-api
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qtnf
      REDIS_URL: redis://redis:6379/0
      FACE_MATCH_THRESHOLD: "0.94"
      FACE_DISPLAY_THRESHOLD: "0.97"
      FACE_AUTO_APPROVE_THRESHOLD: "0.995"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: diga-me-web
    env_file:
      - ../../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      API_BASE_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    build:
      context: ../../apps/worker
      dockerfile: Dockerfile
    container_name: diga-me-worker
    env_file:
      - ../../.env
    environment:
      API_BASE_URL: http://api:8000/api/v1
      WEB_BASE_URL: http://web:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
      NEWS_CRON_INTERVAL_SECONDS: "3600"
      NEWS_CRON_LIMIT_PER_SOURCE: "5"
      NEWS_CRON_MAX_IMAGES_PER_ARTICLE: "4"
    depends_on:
      - api
      - web

volumes:
  pgdata:
